<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>THERMO Hub</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="settings.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <div class="app-container">
        <div class="header">
            <h2 id="main-title">THERMO <span style="color:#3b82f6">Beta</span></h2>
            <div class="header-controls">
                <div id="status-bar" class="status-pill is-online">ONLINE</div>
                <span id="heartbeat-timer">SIGNAL: -- AGO</span>
            </div>
        </div>

        <div class="action-row">
            <div class="action-group-left">
                <button id="install-pwa-btn" class="action-link" style="display: none;" onclick="installApp()">+ INSTALL</button>
                <button id="share-btn" class="action-link" onclick="shareApp()">SHARE</button>
            </div>
            <button class="settings-btn" onclick="toggleView()" id="nav-btn">
                <svg class="gear-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="3"></circle>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                </svg>
            </button>
        </div>

        <div id="main-view" class="view-active">
            <div id="relay-container">
                <div class="relay-box" data-relay="1">
                    <div class="relay-label"><span class="device-name">Relay 1</span> <span id="badge-1" class="state-indicator">OFF</span></div>
                    <div class="timer-row"><label>SEC:</label><input type="number" id="timer-input-1" value="0"></div>
                    <div class="btn-group">
                        <button id="btn-on-1" class="btn btn-on" onclick="publishCommand(1, 'ON')">ON</button>
                        <button id="btn-off-1" class="btn btn-inactive" onclick="publishCommand(1, 'OFF')">OFF</button>
                    </div>
                </div>
                </div>
        </div>

        <div id="settings-view" class="view-hidden">
            <div class="settings-card">
                <h3>DEVICE NAMES</h3>
                <input type="text" id="name-input-1" class="myco-input" placeholder="Relay 1 Name">
                <input type="text" id="name-input-2" class="myco-input" placeholder="Relay 2 Name">
                <input type="text" id="name-input-3" class="myco-input" placeholder="Relay 3 Name">
                <input type="text" id="name-input-4" class="myco-input" placeholder="Relay 4 Name">
                
                <button id="toggle-log-btn" class="action-link" style="width:100%; margin-top:20px; height:35px; justify-content:center;">SHOW SYSTEM LOG</button>
                <div id="debug-log"></div>
            </div>
            <button onclick="saveAllSettings()" class="btn-save">SAVE & APPLY</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
