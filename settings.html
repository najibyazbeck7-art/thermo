<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Thermo - Settings</title>
    <link rel="stylesheet" href="settings.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
</head>
<body>
    <div class="app-container">
        <div id="settings-view">
            <div class="header">
                <h2>Thermo <span style="color:#3b82f6">Settings</span></h2>
                <button onclick="window.location.href='index.html'" class="action-link">← BACK</button>
            </div>

            <div class="settings-card">
                <h3>Device Names</h3>
                <div class="setting-group"><label>Relay 1</label><input type="text" id="name-input-1" class="myco-input"></div>
                <div class="setting-group"><label>Relay 2</label><input type="text" id="name-input-2" class="myco-input"></div>
                <div class="setting-group"><label>Relay 3</label><input type="text" id="name-input-3" class="myco-input"></div>
                <div class="setting-group"><label>Relay 4</label><input type="text" id="name-input-4" class="myco-input"></div>
            </div>

            <div class="settings-card">
                <h3>System Diagnostics</h3>
                <button id="toggle-log-btn">SHOW SYSTEM LOG</button>
                <div id="debug-log"></div>
            </div>

            <button onclick="saveAndExit()" class="btn-save">SAVE & APPLY</button>
        </div>
    </div> 
    <script src="settings.js"></script>
</body>
</html>
